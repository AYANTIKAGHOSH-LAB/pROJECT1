<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechWorld Login</title>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <div class="mainbox">

        
        <nav class="navbar">

            <div class="logo">
                <span class="logo-icon">▣</span>
                TechWorld
            </div>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
                <a href="#" class="login-btn">Login</a>
            </div>

        </nav>


        
        <main class="content">

            
            <div class="left">

                <div class="login-section">

                    <h1>Welcome Back! 👋</h1>

                    <p class="subtitle">
                        Sign in to continue to TechWorld
                    </p>


                    
                    <form>

                        
                        <label for="email">Email Address</label>

                        <div class="input-box">
                            <span>✉</span>
                            <input type="email"
                                id="email"
                                placeholder="Enter your email"
                            >
                        </div>


                        
                        <label for="password">Password</label>

                        <div class="input-box">
                            <span>🔒</span>
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                            >
                            <span>◉</span>
                        </div>


                        
                        <div class="options">

                            <div class="remember">
                                <input type="checkbox" id="remember">
                                <label for="remember">
                                    Remember me
                                </label>
                            </div>

                            <a href="#" class="forgot">
                                Forgot Password?
                            </a>

                        </div>


                        
                        <button type="submit" class="main-login">
                            Login
                        </button>

                    </form>


                    
                    <div class="or">
                        
                        <p>or continue with</p>
                        <span></span>
                    </div>


                    <!-- Social Login -->
                    <div class="social-login">

                        <button class="social-btn">
                            <span class="google">G</span>
                            Google
                        </button>

                        <button class="social-btn">
                            <span class="facebook">f</span>
                            Facebook
                        </button>

                    </div>


                    
                    <p class="register">
                        
                        <a href="#">Register</a>
                    </p>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
